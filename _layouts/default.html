<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    <header>
      <h1>{{ site.title }}</h1>
      <nav>
        {% for item in site.data.navigation %}
          <a href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a> |
        {% endfor %}
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>&copy; {{ site.time | date: '%Y' }} DirtCamAdventure - Ride Safe at Hartley Vale.</p>
    </footer>
  </body>
</html>
