<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    <header>
      <nav>
        <!-- This loop goes into your _data folder and grabs the list -->
        {% for item in site.data.navigation %}
          <a href="{{ site.baseurl }}{{ item.url }}" style="margin-right: 15px;">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>
    <hr>
    
    <main>
      {{ content }}
    </main>
  </body>
</html>
